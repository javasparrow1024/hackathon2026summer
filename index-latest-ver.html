<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing RPG Battle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="game" aria-label="タイピングRPGのバトル画面">
    <section class="enemy-status" aria-label="敵ステータス">
      <div class="enemy-name" data-enemy-name>スライム Lv.1</div>
      <div class="enemy-hp-number" data-enemy-hp>40 / 40</div>
      <div class="bar" aria-label="スライムのHP 40/40"><i data-enemy-bar style="width: 100%"></i></div>
    </section>

<div class="enemy-visual" data-enemy-visual>
  <img class="enemy-image" data-enemy-image src="" alt="">
</div>

    <section class="skill-row" aria-label="タイピングする技">
      <article class="skill-card" data-card="mage">
        <div class="skill-name" data-skill-name>回復</div>
        <div class="typing-word" data-typing-word><b>k</b>aifuku</div>
      </article>
      <article class="skill-card" data-card="swordsman">
        <div class="skill-name" data-skill-name>斬撃</div>
        <div class="typing-word" data-typing-word><b>z</b>angeki</div>
      </article>
      <article class="skill-card" data-card="knight">
        <div class="skill-name" data-skill-name>鉄壁</div>
        <div class="typing-word" data-typing-word><b>t</b>eppeki</div>
      </article>
    </section>

    <section class="party" aria-label="味方のHPと武器">
      <article class="member" data-member="mage" aria-label="魔法使い HP 60/60">
        <div class="weapon-zone" aria-hidden="true"><div class="staff"></div></div>
        <div class="party-hp">
          <div><div class="hp-number" data-hp-number>60 / 60</div><div class="bar"><i data-hp-bar></i></div></div>
        </div>
      </article>
      <article class="member" data-member="swordsman" aria-label="剣士 HP 90/90">
        <div class="weapon-zone" aria-hidden="true"><div class="sword"></div></div>
        <div class="party-hp">
          <div><div class="hp-number" data-hp-number>90 / 90</div><div class="bar"><i data-hp-bar></i></div></div>
        </div>
      </article>
      <article class="member" data-member="knight" aria-label="騎士 HP 130/130">
        <div class="weapon-zone" aria-hidden="true"><div class="shield"></div></div>
        <div class="party-hp">
          <div><div class="hp-number" data-hp-number>130 / 130</div><div class="bar"><i data-hp-bar></i></div></div>
        </div>
      </article>
    </section>
    <div class="battle-message" data-message aria-live="polite">スライムが現れた！</div>
    <button class="restart-button" type="button" data-restart onclick="window.location.reload()">リスタート</button>
  </main>
  <script src="game.js"></script>
</body>
</html>
